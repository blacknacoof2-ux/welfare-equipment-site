name: Refresh dependency lock

on:
  push:
    branches:
      - seo/indexing-recovery-20261007
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: seo/indexing-recovery-20261007
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install next@16.4.0 eslint-config-next@16.4.0 --save-exact
      - run: npm audit fix
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: refresh Next.js and transitive dependencies" || exit 0
          git push origin HEAD:seo/indexing-recovery-20261007
