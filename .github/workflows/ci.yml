name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile once
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already tracked and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Detail image coverage audit
        run: REQUIRE_FULL_DETAIL=1 npm run audit:detail-image-coverage

      - name: Detail image URL integrity audit
        run: REQUIRE_REMOTE_DETAIL=1 npm run audit:detail-image-integrity

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Rendered site audits
        run: |
          npm run start:5000 > /tmp/welfare-site.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          npm run audit:rendered-product-pages
          npm run audit:admin-intake
          npm run audit:product-compare
