name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intake_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Detail image coverage audit
        run: REQUIRE_FULL_DETAIL=1 npm run audit:detail-image-coverage

      - name: Detail image URL integrity audit
        run: REQUIRE_REMOTE_DETAIL=1 npm run audit:detail-image-integrity

      - name: Intake email worker mock tests (no network)
        run: node --test scripts/test-intake-email.mjs

      - name: Outbox PostgreSQL integration tests (isolated DB)
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: intake_test
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-intake-email-postgres.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Rendered site audits
        run: |
          npm run start:5000 > /tmp/welfare-site.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5000/ >/tmp/home.html; then break; fi
            sleep 0.5
          done
          curl -fsSI http://127.0.0.1:5000/favicon.ico | grep -qi '^HTTP/.* 200'
          grep -Fq 'rel="icon"' /tmp/home.html
          grep -Fq '/favicon.ico' /tmp/home.html
          npm run audit:rendered-product-pages
          npm run audit:admin-intake
          npm run audit:product-compare
