name: Catalog Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-carestore-catalog.mjs'
      - 'scripts/verify-eroum-catalog.mjs'
      - 'scripts/generate-live-products.mjs'
      - '.github/workflows/catalog-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Carestore catalog snapshot
        run: node scripts/sync-carestore-catalog.mjs

      - name: Verify every catalog product against Eroum
        run: node scripts/verify-eroum-catalog.mjs

      - name: Build generated live product catalog
        run: node scripts/generate-live-products.mjs artifacts/eroum-verified-catalog.json lib/generated-live-products.ts

      - name: Commit verified live catalog
        shell: bash
        run: |
          if git diff --quiet -- lib/generated-live-products.ts && git ls-files --error-unmatch lib/generated-live-products.ts >/dev/null 2>&1; then
            echo "Generated catalog is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/generated-live-products.ts
          git commit -m "data: sync Eroum verified live product catalog"
          git push origin HEAD:main

      - name: Upload catalog snapshots
        uses: actions/upload-artifact@v4
        with:
          name: verified-welfare-catalog
          path: |
            artifacts/carestore-catalog.json
            artifacts/eroum-verified-catalog.json
            lib/generated-live-products.ts
          if-no-files-found: error
