name: Catalog Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-carestore-catalog.mjs'
      - 'scripts/verify-eroum-catalog.mjs'
      - '.github/workflows/catalog-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Carestore catalog snapshot
        run: node scripts/sync-carestore-catalog.mjs

      - name: Verify every catalog product against Eroum
        run: node scripts/verify-eroum-catalog.mjs

      - name: Upload catalog snapshots
        uses: actions/upload-artifact@v4
        with:
          name: verified-welfare-catalog
          path: |
            artifacts/carestore-catalog.json
            artifacts/eroum-verified-catalog.json
          if-no-files-found: error
