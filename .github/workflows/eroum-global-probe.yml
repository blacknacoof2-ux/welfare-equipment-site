name: Eroum Global Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-eroum-global.mjs'
      - 'scripts/sync-carestore-catalog.mjs'
      - 'scripts/official-seed-products.mjs'
      - '.github/workflows/eroum-global-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build candidate catalog
        run: node scripts/sync-carestore-catalog.mjs
      - name: Reverse audit Eroum storefront
        run: node scripts/audit-eroum-global.mjs
      - name: Upload reverse audit
        uses: actions/upload-artifact@v4
        with:
          name: eroum-global-audit
          path: artifacts/eroum-global-audit.json
          if-no-files-found: error
