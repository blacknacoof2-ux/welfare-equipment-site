name: Greymall Detail Image Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-greymall-detail-images.mjs'
      - '.github/workflows/greymall-detail-sync.yml'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: greymall-detail-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Greymall DETAIL images
        run: npm run sync:greymall-detail-images

      - name: Verify TypeScript
        run: npm install && npm run typecheck

      - name: Verify build
        run: npm run build

      - name: Commit generated Greymall detail image data
        shell: bash
        run: |
          if git diff --quiet -- lib/generated-greymall-detail-images.ts artifacts/greymall-detail-images-audit.json; then
            echo 'No Greymall detail-image changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/generated-greymall-detail-images.ts artifacts/greymall-detail-images-audit.json
          git commit -m 'data: sync Greymall detail images'
          git pull --rebase origin main
          git push origin HEAD:main
