name: Detail Image Fallback Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-carestore-detail-images.mjs'
      - 'lib/product-detail-images.ts'
      - '.github/workflows/greymall-detail-sync.yml'

permissions:
  contents: write

concurrency:
  group: detail-image-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Carestore fallback DETAIL images
        run: node scripts/sync-carestore-detail-images.mjs

      - name: Verify TypeScript
        run: npm install && npm run typecheck

      - name: Verify build
        run: npm run build

      - name: Commit generated Carestore detail image data
        shell: bash
        run: |
          if git diff --quiet -- \
            lib/generated-carestore-detail-images.ts \
            artifacts/carestore-detail-images-audit.json; then
            echo 'No Carestore detail-image changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/generated-carestore-detail-images.ts \
            artifacts/carestore-detail-images-audit.json
          git commit -m 'data: sync Carestore detail images'
          git restore --worktree .
          git pull --rebase origin main
          git push origin HEAD:main
