name: Eroum Probe

on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-eroum-search.mjs'
      - 'scripts/test-eroum-fallback.mjs'
      - '.github/workflows/eroum-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Eroum exact code search
        run: node scripts/test-eroum-search.mjs
      - name: Probe Eroum model-name fallback search
        run: node scripts/test-eroum-fallback.mjs
